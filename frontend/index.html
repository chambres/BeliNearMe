<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeliNearMe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">BeliNearMe</span>
        <span class="brand-sub">Score-ranked restaurant finder, backed by Beli metadata</span>
      </div>
      <div class="topbar-stats">
        <div class="stat">
          <span class="stat-value" id="stat-showing">–</span>
          <span class="stat-label">showing</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-radius">–</span>
          <span class="stat-label">in radius</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-returned">–</span>
          <span class="stat-label">returned</span>
        </div>
      </div>
    </header>

    <div class="app">
      <aside class="controls">
        <form id="query-form">
          <input id="latitude" name="latitude" type="hidden" value="29.7858" />
          <input id="longitude" name="longitude" type="hidden" value="-95.8245" />

          <section class="ctrl-group">
            <h2 class="ctrl-title">Location</h2>
            <div class="coord-readout">
              <span class="coord-value" id="coord-readout">29.7858, −95.8245</span>
              <span class="coord-hint">click map to move</span>
            </div>
            <label class="field">
              <span class="field-label">City filter (optional)</span>
              <input id="city" name="city" type="text" value="" placeholder="e.g. Katy, TX" />
            </label>
            <div class="field">
              <div class="field-head">
                <span class="field-label" style="margin: 0">Radius</span>
                <output id="radius-value" class="radius-out" for="radius">10 mi</output>
              </div>
              <input id="radius" name="radius" type="range" min="1" max="100" step="1" value="10" />
              <div class="range-scale"><span>1 mi</span><span>100 mi</span></div>
            </div>
            <label class="field">
              <span class="field-label">Sort by</span>
              <select id="sort" name="sort">
                <option value="Score" selected>Beli Score</option>
                <option value="Distance">Distance</option>
                <option value="Most Trending">Most Trending</option>
                <option value="Recency">Recency</option>
                <option value="Date added">Date added</option>
                <option value="Number of friends">Number of friends</option>
              </select>
            </label>
          </section>

          <section class="ctrl-group">
            <h2 class="ctrl-title">Price</h2>
            <div id="price-options" class="chip-row" aria-label="Price levels"></div>
          </section>

          <section class="ctrl-group">
            <h2 class="ctrl-title">Cuisines</h2>
            <div id="cuisine-options" class="chip-row" aria-label="Cuisine options"></div>

            <div class="subfield">
              <label class="sublabel">Included — drag a chip down to exclude it</label>
              <div id="selected-cuisines" class="token-box" aria-live="polite"></div>
            </div>

            <div class="custom-row">
              <input id="custom-cuisine" name="customCuisine" type="text" placeholder="Add custom cuisine" />
              <button type="button" id="add-cuisine-button" class="btn-ghost">Add</button>
            </div>

            <div class="subfield">
              <label class="sublabel">Excluded</label>
              <div id="excluded-cuisines-dropzone" class="token-box drop" aria-label="Excluded cuisines drop zone">
                <div id="excluded-cuisines" class="token-inner" style="display: contents"></div>
              </div>
            </div>
          </section>

          <section class="ctrl-group">
            <h2 class="ctrl-title">Options</h2>
            <label class="check">
              <input id="open-now" name="openNow" type="checkbox" />
              <span>Open now only</span>
            </label>
            <label class="check">
              <input id="exact-radius" name="exactRadius" type="checkbox" checked />
              <span>Exact radius only (drop rectangular-bounds spillover)</span>
            </label>
          </section>

          <div class="actions">
            <button type="submit" id="submit-button" class="btn-primary">Search</button>
            <button type="button" id="reset-button" class="btn-ghost">Reset</button>
          </div>
        </form>
      </aside>

      <main class="workspace">
        <div id="map-picker" class="map" aria-label="Map"></div>
        <section class="results">
          <div class="results-bar">
            <span id="status-banner" class="status">Adjust the filters and press Search.</span>
            <span id="results-note" class="results-note"></span>
          </div>
          <ol id="results-list" class="results-list">
            <li class="list-placeholder">No results yet.</li>
          </ol>
        </section>
      </main>
    </div>

    <template id="result-row-template">
      <li class="row">
        <span class="row-rank"></span>
        <div class="row-main">
          <div class="row-headline">
            <span class="row-name"></span>
            <a class="row-link" target="_blank" rel="noreferrer">Beli ↗</a>
          </div>
          <div class="row-meta"></div>
        </div>
        <div class="row-score">
          <span class="row-score-value"></span>
          <span class="row-score-label">Beli avg</span>
        </div>
      </li>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
